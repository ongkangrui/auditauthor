services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      AUDIT_MODEL: ${AUDIT_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AUDIT_DATA_DIR: /data
      AUDIT_MAX_UPLOAD_MB: ${AUDIT_MAX_UPLOAD_MB:-20}
      AUDIT_MAX_PAGES: ${AUDIT_MAX_PAGES:-500}
      AUDIT_MAX_PENDING_JOBS: ${AUDIT_MAX_PENDING_JOBS:-8}
      AUDIT_CHUNK_CHARS: ${AUDIT_CHUNK_CHARS:-14000}
      AUDIT_OVERLAP_CHARS: ${AUDIT_OVERLAP_CHARS:-2000}
      AUDIT_MODEL_TIMEOUT: ${AUDIT_MODEL_TIMEOUT:-120}
      AUDIT_MODEL_ATTEMPTS: ${AUDIT_MODEL_ATTEMPTS:-3}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - audit-data:/data
      - ./input:/samples:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      API_BASE_URL: http://backend:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  audit-data:
